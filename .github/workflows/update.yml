name: 追蹤 8zz 並更新看板

on:
  push:
    branches: [main]
  schedule:
    # 台股盤中（台北 09:00–13:30）每 30 分鐘，週一到週五（cron 用 UTC）
    - cron: "0,30 1-5 * * 1-5"
    # 盤前 08:10、晚上 18:10、22:10（台北），每天都跑，抓盤後和深夜的貼文
    - cron: "10 0,10,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓新貼文並用 Claude 判讀
        if: github.event_name != 'push'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then echo "沒設 APIFY_TOKEN，跳過抓貼文"; exit 0; fi
          pip install --quiet anthropic
          python fetch_fb.py

      - run: python build.py

      - name: 把新事件和盤中資料存回 repo
        if: github.event_name != 'push'
        run: |
          git add events.csv seen_posts.json data/ 2>/dev/null || true
          git add pending.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git config user.name "8zz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新 8zz 貼文事件與盤中資料"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
